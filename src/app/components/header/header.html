<header class="sticky top-0 z-50 bg-gray-900 shadow-lg">

  <div class="mx-auto flex max-w-7xl items-center gap-8 px-6 py-4">

    <!-- Logo -->
    <a class="shrink-0 cursor-pointer text-2xl font-bold text-yellow-400">
      COMIQUERÍA
    </a>

    <!-- Navegación -->
    <nav class="hidden items-center gap-6 lg:flex">

      <a class="cursor-pointer font-medium text-white transition hover:text-yellow-400">
        Inicio
      </a>

      <a class="cursor-pointer font-medium text-gray-300 transition hover:text-yellow-400">
        Productos
      </a>

      <a class="cursor-pointer font-medium text-gray-300 transition hover:text-yellow-400">
        Ofertas
      </a>

    </nav>

    <!-- Buscador -->
    <div class="hidden flex-1 md:block">
      <div class="relative mx-auto max-w-xl">

        <input type="text" placeholder="Buscar comics, mangas, productos..."
          class="w-full rounded-lg bg-white px-4 py-2.5 pr-12 text-gray-900 outline-none" />

        <button
          class="absolute right-0 top-0 flex h-full cursor-pointer items-center px-4 text-gray-500 hover:text-gray-900"
          aria-label="Buscar">
          🔍
        </button>

      </div>
    </div>

    <!-- Acciones -->
    <div class="ml-auto flex items-center gap-5">

      <button class="hidden cursor-pointer text-gray-300 transition hover:text-yellow-400 sm:block">
        Favoritos
      </button>

      <button class="relative cursor-pointer text-gray-300 transition hover:text-yellow-400">
        Carrito

        <span
          class="absolute -right-3 -top-3 flex h-5 min-w-5 items-center justify-center rounded-full bg-yellow-400 px-1 text-xs font-bold text-gray-900">
          0
        </span>
      </button>

      <button
        class="cursor-pointer rounded-lg bg-yellow-400 px-4 py-2 font-bold text-gray-900 transition hover:bg-yellow-300">
        Mi cuenta
      </button>

    </div>

  </div>

</header>
