<article class="overflow-hidden rounded-xl bg-white shadow-sm">
  <div class="flex aspect-[3/4] items-center justify-center bg-gray-200">
    <span class="text-gray-400">{{ imagenURL }}</span>
  </div>

  <div class="p-5">
    <p class="text-sm font-medium text-gray-500">
      {{ categoria }}
    </p>

    <h3 class="mt-1 text-lg font-bold text-gray-900">
      {{ titulo }}
    </h3>

    <p class="mt-3 text-xl font-bold text-gray-900">
      $ {{ precio | number:'1.2-2':'es-AR' }}
    </p>
  </div>
</article>
